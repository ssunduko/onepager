# Full OSV-Scanner scan of main after every merge (each merge lands as a push to main),
# and on demand. Fails on any known vulnerability, including ones disclosed since the
# dependency was added; results also appear under Security > Code scanning.
# Pull requests are scanned by osv-scanner-pr.yml.
# Docs: https://google.github.io/osv-scanner/github-action/
name: OSV-Scanner merge scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Required to upload the SARIF results to code scanning.
  actions: read
  contents: read
  security-events: write

jobs:
  scan-merge:
    # Pinned to the v2.7.0 commit; bump the SHA and the comment together when upgrading.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
