# Scans dependency lockfiles (package-lock.json) with OSV-Scanner on every pull request, into any
# branch, and in the merge queue. It compares the PR against its base branch and fails only on
# vulnerabilities the PR introduces; results also appear under Security > Code scanning.
# Merges into main get a full scan from osv-scanner-merge.yml.
# Docs: https://google.github.io/osv-scanner/github-action/
name: OSV-Scanner PR scan

on:
  pull_request:
  merge_group:
    branches: [main]

permissions:
  # Required to upload the SARIF results to code scanning.
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    # Pinned to the v2.7.0 commit; bump the SHA and the comment together when upgrading.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
